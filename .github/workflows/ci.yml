name: Offline triage validation
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -W error -m unittest -v
      - run: python triage.py fixtures/events.json
      - run: kubectl kustomize k8s >/dev/null
